name: Deploy Site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "personal-site/**"
      - "meridian-finance/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Both apps publish into one Pages site, so they must deploy together.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            personal-site/package-lock.json
            meridian-finance/package-lock.json

      - run: npm ci
        working-directory: personal-site
      - run: npm run build
        working-directory: personal-site

      - run: npm ci
        working-directory: meridian-finance
      - run: npm run build
        working-directory: meridian-finance

      - name: Assemble site (Meridian served under /meridian-finance/)
        run: |
          mkdir -p personal-site/out/meridian-finance
          cp -R meridian-finance/dist/. personal-site/out/meridian-finance/

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: personal-site/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
